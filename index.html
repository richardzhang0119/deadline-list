    <script>
      // Apply a saved light/dark choice before the page draws (see src/theme.ts).
      try {
        const theme = localStorage.getItem('deadline-list.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {
        // Storage blocked: the device's setting decides.
      }
    </script>
